    <!-- Before the stylesheets: a script that follows a pending stylesheet waits for it to load. -->
    <script>
      (function () {
        var langs = ['en', 'es', 'pt'];
        var stored = null;
        try {
          stored = localStorage.getItem('framed-lang');
        } catch (error) {
          stored = null;
        }
        var lang = stored || navigator.language.slice(0, 2);
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = '/assets/i18n/' + (langs.indexOf(lang) > -1 ? lang : 'en') + '.json';
        document.head.appendChild(link);

        // The home hero is the largest image on the first screen: start downloading it now instead of
        // when Angular renders it. Other pages do not show it, so they must not pay for it.
        // Keep the address in step with LANDING_HERO_SOURCE (a test checks it).
        if (location.pathname === '/') {
          var hero = document.createElement('link');
          hero.rel = 'preload';
          hero.as = 'image';
          hero.href = '/assets/hero/flatiron.webp';
          hero.setAttribute('fetchpriority', 'high');
          document.head.appendChild(hero);
        }
      })();
    </script>
