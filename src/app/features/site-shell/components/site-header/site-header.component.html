<header class="site-header" *transloco="let t">
  <a
    class="site-header__brand"
    routerLink="/"
    [attr.aria-label]="t('nav.home')"
    (click)="closeMenu()"
  >
    <span class="link-grow">Framed by Santi</span>
  </a>

  <button
    class="site-header__menu-button"
    aria-controls="site-menu"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? t('nav.closeMenu') : t('nav.menu')"
    [class.site-header__menu-button--open]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="site-header__menu-bar" aria-hidden="true"></span>
    <span class="site-header__menu-bar" aria-hidden="true"></span>
  </button>

  <div class="site-header__panel" id="site-menu" [class.site-header__panel--open]="menuOpen()">
    <nav class="site-header__nav" [attr.aria-label]="t('nav.ariaLabel')">
      <a
        class="site-header__link"
        routerLink="/gallery"
        routerLinkActive="site-header__link--active"
        (click)="closeMenu()"
      >
        <span class="link-grow">{{ t('nav.gallery') }}</span>
      </a>
      <a
        class="site-header__link"
        routerLink="/about"
        routerLinkActive="site-header__link--active"
        (click)="closeMenu()"
      >
        <span class="link-grow">{{ t('nav.about') }}</span>
      </a>
      @if (isAdmin()) {
        <button class="site-header__link site-header__signout" type="button" (click)="signOut()">
          <span class="link-grow">{{ t('nav.signOut') }}</span>
        </button>
      }
    </nav>

    <app-lang-selector />
  </div>
</header>
