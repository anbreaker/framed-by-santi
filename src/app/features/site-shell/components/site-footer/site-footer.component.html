<footer class="site-footer" *transloco="let t">
  <p class="meta">{{ t('footer.copyright', { year }) }}</p>

  <nav class="site-footer__links" [attr.aria-label]="t('nav.ariaLabel')">
    <a class="site-footer__link" rel="noopener" target="_blank" [href]="instagramUrl">
      <span class="link-grow site-footer__link-label">
        <app-instagram-icon />
        {{ t('footer.instagram') }} ↗
      </span>
    </a>
    <a class="site-footer__link" routerLink="/about">
      <span class="link-grow">{{ t('footer.about') }}</span>
    </a>
  </nav>

  <p class="site-footer__credit">
    <a
      class="site-footer__credit-link"
      rel="noopener noreferrer"
      target="_blank"
      [href]="rootdevsUrl"
    >
      <span class="link-grow">{{ t('footer.madeWith') }}</span>
      <img
        class="site-footer__credit-logo"
        alt="rootdevs"
        decoding="async"
        height="75"
        loading="lazy"
        src="/assets/images/rootdevs-logo.webp"
        width="200"
      />
    </a>
  </p>
</footer>
