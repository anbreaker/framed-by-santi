<section class="login-form" *transloco="let t">
  <header class="login-form__header">
    <p class="meta">{{ t('admin.login.eyebrow') }}</p>
    <h1 class="login-form__title">{{ t('admin.login.title') }}</h1>
  </header>

  @if (unavailable()) {
    <p class="login-form__notice login-form__notice--error" role="alert">
      {{ t('admin.login.unavailable') }}
    </p>
  } @else {
    <form class="login-form__form" novalidate (submit)="submit($event)">
      <label class="login-form__field">
        <span class="login-form__label">{{ t('admin.login.email') }}</span>
        <input
          class="login-form__input"
          autocomplete="username"
          inputmode="email"
          name="email"
          type="email"
          [value]="email()"
          (input)="onEmail($event)"
        />
      </label>

      <!-- Not a wrapping label: the eye button inside it would join the field's accessible name. -->
      <div class="login-form__field">
        <label class="login-form__label" for="login-password">
          {{ t('admin.login.password') }}
        </label>
        <div class="login-form__secret">
          <input
            class="login-form__input"
            autocomplete="current-password"
            id="login-password"
            name="password"
            [type]="passwordShown() ? 'text' : 'password'"
            [value]="password()"
            (input)="onPassword($event)"
          />
          <button
            class="login-form__reveal"
            type="button"
            [attr.aria-label]="t('admin.login.showPassword')"
            [attr.aria-pressed]="passwordShown()"
            (click)="togglePassword()"
          >
            <svg
              aria-hidden="true"
              fill="none"
              height="20"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.75"
              viewBox="0 0 24 24"
              width="20"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              @if (passwordShown()) {
                <path d="M4 4l16 16" />
              }
            </svg>
          </button>
        </div>
      </div>

      @if (notice(); as current) {
        <p
          class="login-form__notice"
          [attr.role]="current.kind === 'error' ? 'alert' : 'status'"
          [class.login-form__notice--error]="current.kind === 'error'"
        >
          {{ t(current.key) }}
        </p>
      }

      <div class="login-form__actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting()">
          {{ submitting() ? t('admin.login.submitting') : t('admin.login.submit') }}
        </button>
        <button class="login-form__link" type="button" (click)="resetPassword()">
          <span class="link-grow">{{ t('admin.login.forgot') }}</span>
        </button>
      </div>
    </form>
  }
</section>
