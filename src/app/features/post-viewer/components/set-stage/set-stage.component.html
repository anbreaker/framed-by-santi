<div
  class="set-stage"
  *transloco="let t"
  (pointercancel)="onPointerCancel()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
>
  <div class="set-stage__frame" [style.view-transition-name]="transitionName()">
    @for (item of shownPhotos(); track item.id) {
      <app-zoomable-photo
        class="set-stage__photo"
        [attr.data-direction]="direction()"
        [class.set-stage__photo--out]="fading()"
        [photo]="item"
        (zoomedChange)="isZoomed.set($event)"
      />
    }
    @if (incoming(); as upcoming) {
      <app-zoomable-photo
        aria-hidden="true"
        class="set-stage__photo set-stage__photo--incoming"
        inert
        [attr.data-direction]="direction()"
        [photo]="upcoming"
      />
    }
  </div>

  <button
    class="set-stage__arrow set-stage__arrow--previous"
    type="button"
    [attr.aria-label]="t('viewer.previous')"
    [disabled]="isFirst()"
    (click)="previous.emit()"
  >
    <svg
      aria-hidden="true"
      fill="none"
      height="22"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.6"
      viewBox="0 0 24 24"
      width="22"
    >
      <path d="M15 5l-7 7 7 7" />
    </svg>
  </button>

  <button
    class="set-stage__arrow set-stage__arrow--next"
    type="button"
    [attr.aria-label]="t('viewer.next')"
    [disabled]="isLast()"
    (click)="next.emit()"
  >
    <svg
      aria-hidden="true"
      fill="none"
      height="22"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.6"
      viewBox="0 0 24 24"
      width="22"
    >
      <path d="M9 5l7 7-7 7" />
    </svg>
  </button>
</div>
