<nav class="tag-filter" *transloco="let t" [attr.aria-label]="t('gallery.filtersLabel')">
  <a
    class="tag-filter__chip"
    [attr.aria-current]="selected() === null ? 'true' : null"
    [queryParams]="{ tag: null }"
    [routerLink]="[]"
  >
    {{ t('gallery.allFilter') }}
  </a>

  @for (theme of themes(); track theme.id) {
    <a
      class="tag-filter__chip"
      [attr.aria-current]="selected() === theme.id ? 'true' : null"
      [queryParams]="{ tag: theme.id }"
      [routerLink]="[]"
    >
      {{ theme.label | localizedText: lang() }}
    </a>
  }
</nav>
