<section class="set-strip" *transloco="let t" appScrollReveal>
  <header class="set-strip__header">
    <div class="set-strip__heading">
      <h2 class="set-strip__title">
        <a [routerLink]="['/gallery', post().id]">{{ post().caption | localizedText: lang() }}</a>
      </h2>
      <p class="meta set-strip__meta">
        {{ post().takenAt | localizedDate: lang() }} ·
        {{
          t(post().photos.length | pluralKey: 'gallery.photoCount' : lang(), {
            count: post().photos.length,
          })
        }}
      </p>
    </div>
    <a class="btn btn--ghost set-strip__open" [routerLink]="['/gallery', post().id]">
      {{ t('gallery.viewSet') }}
    </a>
  </header>

  <app-photo-carousel
    class="set-strip__carousel"
    [label]="post().caption | localizedText: lang()"
    [post]="post()"
  />
</section>
