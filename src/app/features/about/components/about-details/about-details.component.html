<section class="about-details" *transloco="let t">
  <dl class="about-details__list" appScrollReveal>
    <div class="about-details__row">
      <dt class="meta about-details__term">{{ t('about.camera') }}</dt>
      <dd class="about-details__value">{{ t('about.cameraValue') }}</dd>
    </div>
    <div class="about-details__row">
      <dt class="meta about-details__term">{{ t('about.city') }}</dt>
      <dd class="about-details__value">{{ t('about.cityValue') }}</dd>
    </div>
    <div class="about-details__row">
      <dt class="meta about-details__term">{{ t('common.instagram') }}</dt>
      <dd class="about-details__value">
        <a class="about-details__link" rel="noopener" target="_blank" [href]="instagramUrl">
          <span class="link-grow about-details__link-label">
            <app-instagram-icon />
            {{ instagramHandle }}
          </span>
        </a>
      </dd>
    </div>
  </dl>

  <div class="about-details__actions" appScrollReveal>
    <a class="btn btn--primary" routerLink="/gallery">{{ t('home.ctaGallery') }}</a>
    <a class="btn btn--ghost" rel="noopener" target="_blank" [href]="instagramUrl">
      <app-instagram-icon />
      {{ t('about.instagramCta') }}
    </a>
  </div>
</section>
