<section class="about-profile" *transloco="let t">
  <div class="about-profile__photo" appScrollReveal="frame">
    @if (ready()) {
      <app-post-photo
        sizes="(min-width: 768px) 480px, 384px"
        [alt]="t('about.photoAlt')"
        [eager]="true"
        [photo]="portrait().photo"
        [source]="portrait().source"
      />
    } @else {
      <div class="about-profile__placeholder"></div>
    }
  </div>

  <div class="about-profile__text" appScrollReveal>
    <p class="meta">{{ t('about.eyebrow') }}</p>
    <h1 class="about-profile__title">{{ t('about.title') }}</h1>
    <p class="about-profile__tagline">{{ t('home.tagline') }}</p>
    <div class="about-profile__story">
      <p>{{ t('about.story.p1') }}</p>
      <p>{{ t('about.story.p2') }}</p>
      <p>{{ t('about.story.p3') }}</p>
      <p>{{ t('about.story.p4') }}</p>
    </div>
    <p class="about-profile__signature">{{ t('about.story.signature') }}</p>
  </div>
</section>
