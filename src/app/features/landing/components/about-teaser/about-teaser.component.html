<section class="about-teaser" *transloco="let t">
  <div class="about-teaser__photo" appScrollReveal="frame">
    <app-post-photo [alt]="t('about.photoAlt')" [photo]="profilePhoto" />
  </div>

  <div class="about-teaser__text" appScrollReveal>
    <p class="meta">{{ t('about.eyebrow') }}</p>
    <h2 class="about-teaser__title">{{ t('about.title') }}</h2>
    <p class="about-teaser__intro">{{ t('about.intro') }}</p>
    <a class="btn btn--ghost" routerLink="/about">{{ t('home.aboutCta') }}</a>
  </div>
</section>
