<main class="gallery-page" id="main-content" tabindex="-1" *transloco="let t">
  <header class="gallery-page__header" appScrollReveal>
    <p class="meta">
      {{ t(postCount() | pluralKey: 'gallery.postCount' : lang(), { count: postCount() }) }}
    </p>
    <h1 class="gallery-page__title">{{ t('gallery.title') }}</h1>
  </header>

  <app-tag-filter [selected]="selectedTag()" [themes]="availableThemes()" />

  @if (postCount() > 0) {
  <app-post-grid [posts]="visiblePosts()" />
  } @else {
  <p class="gallery-page__empty">{{ t('gallery.emptyFilter') }}</p>
  }
</main>
