<main class="not-found" id="main-content" tabindex="-1" *transloco="let t">
  <p class="not-found__eyebrow">{{ t('notFound.eyebrow') }}</p>
  <h1 class="not-found__title">{{ t('notFound.title') }}</h1>
  <p class="not-found__text">{{ t('notFound.text') }}</p>

  <div class="not-found__actions">
    <a class="btn btn--primary" routerLink="/">{{ t('notFound.home') }}</a>
    <a class="btn btn--ghost" routerLink="/gallery">{{ t('notFound.gallery') }}</a>
  </div>
</main>
