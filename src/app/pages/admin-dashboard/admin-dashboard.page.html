<main class="admin-dashboard" id="main-content" tabindex="-1" *transloco="let t">
  <header class="admin-dashboard__header">
    <div>
      <p class="meta">{{ t('admin.dashboard.eyebrow') }}</p>
      <h1 class="admin-dashboard__title">{{ t('admin.dashboard.title') }}</h1>
    </div>
    <button class="btn btn--ghost" type="button" (click)="signOut()">
      {{ t('admin.dashboard.signOut') }}
    </button>
  </header>
  <app-post-editor />
</main>
